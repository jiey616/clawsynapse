name: Release

on:
  push:
    tags:
      - "v*"

# CI only publishes source artifacts (cross-compiled CLI/daemon binaries +
# GitHub Release). Docker images are built and pushed from a local machine
# (see docs/install-mirror.md / local buildx flow) — no registry secrets or
# in-CI image builds are needed here.
permissions:
  contents: write

# Serialize release runs so overlapping tag pushes don't race on the release
# upload step. Queue (don't cancel) so an in-progress run finishes first.
concurrency:
  group: release-${{ github.workflow }}
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Setup Go
        uses: actions/setup-go@v6
        with:
          go-version-file: go.mod

      - name: Run tests
        run: go test ./...

      - name: Build release artifacts
        run: make release-prep VERSION=${GITHUB_REF_NAME}

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          name: ${{ github.ref_name }}
          prerelease: ${{ contains(github.ref_name, '-') }}
          body_path: dist/release-notes-${{ github.ref_name }}.md
          files: |
            dist/checksums.txt
            dist/clawsynapse-darwin-amd64
            dist/clawsynapse-darwin-arm64
            dist/clawsynapse-linux-amd64
            dist/clawsynapse-linux-arm64
            dist/clawsynapse-windows-amd64.exe
            dist/clawsynapse-windows-arm64.exe
            dist/clawsynapsed-darwin-amd64
            dist/clawsynapsed-darwin-arm64
            dist/clawsynapsed-linux-amd64
            dist/clawsynapsed-linux-arm64
            dist/clawsynapsed-windows-amd64.exe
            dist/clawsynapsed-windows-arm64.exe
